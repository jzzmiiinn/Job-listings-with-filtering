<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>static-job-listings-master</title>
  </head>

  <body class="min-h-screen bg-[hsl(180,52%,96%)]">
    <div
      class="bg-[hsl(180,29%,50%)] h-32 w-full bg-[url('/assets/bg-header-mobile.svg')] bg-cover bg-center md:h-40 md:bg-[url('/assets/bg-header-desktop.svg')]"
    ></div>
    <main>
      <div
        id="filter-bar"
        class="hidden w-[90%] max-w-[900px] bg-white shadow-md -translate-y-1/2 mx-auto p-4 md:p-5 rounded-md justify-between items-center gap-4"
      >
        <div id="selected-tags" class="flex flex-wrap gap-2 flex-1"></div>

        <button
          id="clear-btn"
          class="shrink-0 text-[hsl(180,29%,50%)] font-bold hover:underline"
        >
          Clear
        </button>
      </div>
      <div
        id="jobs-list"
        class="flex flex-col gap-5 justify-center items-center"
      ></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
